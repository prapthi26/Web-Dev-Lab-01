<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Header and Footer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: lightblue;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: black;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: lightgray;
        }

        .social {
            display: flex;
            gap: 15px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">My Portfolio</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to My Portfolio</h1>
        <p>I am a Computer Science student.</p>
    </main>

    <footer>
        <p>©️ 2026 My Portfolio</p>

        <div class="social">
            <a href="#">Instagram</a>
            <a href="#">LinkedIn</a>
            <a href="#">Email</a>
        </div>
    </footer>

</body>
</html>
