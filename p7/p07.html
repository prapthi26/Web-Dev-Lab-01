
<!DOCTYPE html>
<html>
<head>
    <title>Design Tokens</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            color: black;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: rgb(60, 98, 179);
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            margin: 20px;
            padding: 20px;
            background-color: white;
        }

        h2 {
            color: rgb(72, 91, 160);
            font-size: 24px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        .card {
            background-color: lightgray;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Design System</h1>
        <p>Learning CSS Design Tokens</p>
    </header>

    <main>
        <h2>Typography System</h2>

        <p>
            This is a sample webpage created using
            HTML and CSS.
        </p>

        <div class="card">
            <h2>Sample Card</h2>
            <p>
                CSS helps maintain consistent colours,
                fonts and spacing throughout a webpage.
            </p>
        </div>
    </main>

    <footer>
        <p>Copyright 2026 | My Website</p>
    </footer>

</body>
</html>
