<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navbar and Card Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* Navigation Bar */
        nav {
            background-color: darkblue;
            display: flex;
            justify-content: space-around;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Card Grid */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        .card {
            width: 250px;
            padding: 20px;
            border: 1px solid gray;
            text-align: center;
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
        }

        /* Responsive Design */
        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .card-container {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>

    <div class="card-container">

        <div class="card">
            <img src="https://picsum.photos/250/150?1" alt="Project 1">
            <h2>Project 1</h2>
            <p>My first project.</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/150?2" alt="Project 2">
            <h2>Project 2</h2>
            <p>My second project.</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/150?3" alt="Project 3">
            <h2>Project 3</h2>
            <p>My third project.</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/150?4" alt="Project 4">
            <h2>Project 4</h2>
            <p>My fourth project.</p>
        </div>

    </div>

</body>
</html>
