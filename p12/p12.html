<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Projects Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 200px 200px;
            gap: 20px;
        }

        .project {
            padding: 20px;
            background-color: lightblue;
            border: 2px solid darkblue;
            border-radius: 10px;
        }

        .project1 {
            grid-column: 1 / 3;
        }

        .project2 {
            grid-row: 1 / 3;
            grid-column: 3;
        }
    </style>
</head>

<body>

    <h1>My Projects</h1>

    <div class="projects">

        <div class="project project1">
            <h2>Portfolio Website</h2>
            <p>A personal portfolio website using HTML and CSS.</p>
        </div>

        <div class="project project2">
            <h2>Travel Buddy</h2>
            <p>An application idea for solo travellers.</p>
        </div>

        <div class="project">
            <h2>Calculator</h2>
            <p>A simple calculator project.</p>
        </div>

        <div class="project">
            <h2>To-Do List</h2>
            <p>A simple task management project.</p>
        </div>

    </div>

</body>
</html>
